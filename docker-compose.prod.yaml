services:
  backend:
    image: rodrigoesteves13/pmaxing-backend:1.1.2
    ports:
      - "3000:3000"
    env_file:
      - backend/.env
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost
      - COOKIE_SECURE=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: rodrigoesteves13/pmaxing-frontend:1.1.2-localtest
    ports:
      - "80:80"
    env_file:
      - backend/.env
    depends_on:
      - backend
    restart: unless-stopped