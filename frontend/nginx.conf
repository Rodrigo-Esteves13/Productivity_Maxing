server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback para index.html em qualquer rota - necessário para o React
    # Router funcionar em URLs diretas (ex: dar refresh em /dashboard não
    # pode devolver 404 do nginx, tem de devolver sempre o index.html e
    # deixar o React tratar do routing client-side).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo para os assets com hash no nome (JS/CSS gerados pelo
    # Vite) - são imutáveis, um deploy novo gera nomes de ficheiro diferentes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}