    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PMaxing" />

    <!-- Google Search Console verification: NOT added yet, left as a
         placeholder. Recommended way to verify instead: a DNS TXT record
         on app.pmaxing.pt (Search Console -> Add property -> Domain ->
         gives you the TXT value, add it wherever you manage DNS for
         pmaxing.pt) - zero code, zero deploys, and it verifies the whole
         domain instead of just this one property. If you'd rather use the
         HTML meta tag method instead, uncomment the line below and paste
         the content value Search Console gives you:
    <meta name="google-site-verification" content="PASTE_VERIFICATION_CODE_HERE" />
