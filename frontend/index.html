<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity Maxing</title>

    <!-- PWA -->
    <meta name="theme-color" content="#a52ff0" />
    <meta name="description" content="Productivity Maxing (PMaxing): free, open-source task and grade tracker for university students, with optional Google Calendar sync." />


    <!-- iOS não lê o manifest.webmanifest da mesma forma que o Android,
         por isso precisa destas tags à parte para "Adicionar ao ecrã inicial". -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PMaxing" />

    <!-- Google Search Console verification: NOT added yet, left as a
         placeholder. Recommended way to verify instead: a DNS TXT record
         on app.pmaxing.pt (Search Console -> Add property -> Domain ->
         gives you the TXT value, add it wherever you manage DNS for
         pmaxing.pt) - zero code, zero deploys, and it verifies the whole
         domain instead of just this one property. If you'd rather use the
         HTML meta tag method instead, uncomment the line below and paste
         the content value Search Console gives you:
    <meta name="google-site-verification" content="PASTE_VERIFICATION_CODE_HERE" />
    -->
  </head>
  <body>
    <noscript>
    <h1>Productivity Maxing (PMaxing)</h1>
    <p>Productivity Maxing, also known as PMaxing at pmaxing.pt, is a free, open-source task and grade tracker for university students. Organize coursework, track deadlines and difficulty, compare target vs real grades, plan study time around your class schedule, and optionally sync tasks and your timetable to Google Calendar.</p>
    <p><a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Service</a> · <a href="/login">Sign in</a></p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
